{% extends 'base.html' %}
{% block title %}404 — Магазин{% endblock %}

{% block content %}

<div style="text-align:center; padding:60px 0;">
    <h1 style="font-size:4rem; margin-bottom:8px;">404</h1>

    <p style="font-size:1.2rem; margin-bottom:24px; color:#555;">
        Страница не найдена
    </p>

    <a class="btn btn-primary" href="{{ url_for('index') }}">
        На главную
    </a>

    {% if current_user.is_authenticated %}
    <div style="margin-top:20px; font-size:0.9rem; color:#777;">
        Вы вошли как: <strong>{{ current_user.name }}</strong>
    </div>
    {% endif %}
</div>

{% endblock %}

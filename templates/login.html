{% extends 'base.html' %}
{% block title %}Вход — Магазин{% endblock %}

{% block content %}
<div style="max-width:400px; margin:0 auto;">
    <h1 style="margin-bottom:24px;">Вход в аккаунт</h1>
    <form method="post">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required autofocus>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:10px;">Войти</button>
    </form>
    <p style="margin-top:16px; font-size:0.9rem; text-align:center;">
        Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}

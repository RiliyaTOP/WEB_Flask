{% extends 'base.html' %}
{% block title %}Оформление заказа — Магазин{% endblock %}

{% block content %}
<h1 style="margin-bottom:24px;">Оформление заказа</h1>

<div style="display:grid; grid-template-columns:2fr 1fr; gap:32px;">
    <form method="post">
        <h2 style="margin-bottom:16px; font-size:1rem; border-bottom:1px solid #000; padding-bottom:8px;">Данные получателя</h2>
        <div class="form-group">
            <label>Имя</label>
            <input type="text" name="name" placeholder="Иван Иванов" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="mail@example.com" required>
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" name="phone" placeholder="+7 (999) 000-00-00">
        </div>

        <h2 style="margin:20px 0 16px; font-size:1rem; border-bottom:1px solid #000; padding-bottom:8px;">Адрес доставки</h2>
        <div class="form-group">
            <label>Город</label>
            <input type="text" name="city" placeholder="Москва" required>
        </div>
        <div class="form-group">
            <label>Адрес</label>
            <input type="text" name="address" placeholder="ул. Примерная, д. 1, кв. 1" required>
        </div>

        <h2 style="margin:20px 0 16px; font-size:1rem; border-bottom:1px solid #000; padding-bottom:8px;">Способ оплаты</h2>
        <div class="form-group">
            <label><input type="radio" name="payment" value="card" checked> Банковская карта</label>
        </div>
        <div class="form-group">
            <label><input type="radio" name="payment" value="cash"> Наличными при получении</label>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:8px; padding:10px 24px;">Подтвердить заказ</button>
    </form>

    <div style="border:1px solid #000; padding:16px; align-self:start;">
        <h2 style="margin-bottom:12px; font-size:1rem;">Ваш заказ</h2>
        <p style="color:#555; font-size:0.85rem; margin-bottom:12px;">(товары из корзины)</p>
        <div style="border-top:1px solid #000; padding-top:12px; font-size:1.1rem; font-weight:bold;">
            Итого: {{ total }} ₽
        </div>
    </div>
</div>
{% endblock %}

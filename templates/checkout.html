{% extends 'base.html' %}
{% block title %}Оформление заказа — Магазин{% endblock %}

{% block content %}
<h2 class="mb-4">Оформление заказа</h2>

<div class="row g-4">
    <div class="col-md-8">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">Данные получателя</div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="tel" name="phone" class="form-control">
                    </div>
                    <hr>
                    <h6 class="mb-3">Адрес доставки</h6>
                    <div class="mb-3">
                        <label class="form-label">Город</label>
                        <input type="text" name="city" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Адрес</label>
                        <input type="text" name="address" class="form-control" required>
                    </div>
                    <hr>
                    <h6 class="mb-3">Способ оплаты</h6>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="payment" value="card" id="card" checked>
                        <label class="form-check-label" for="card">Карта</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="payment" value="cash" id="cash">
                        <label class="form-check-label" for="cash">Наличными</label>
                    </div>
                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-bag-check"></i> Подтвердить заказ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">Ваш заказ</div>
            <div class="card-body">
                <p class="text-muted small">(товары из корзины)</p>
                <hr>
                <p class="fs-5 fw-bold mb-0">Итого: {{ total }} ₽</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
